name: tests

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install server dependencies
        working-directory: ./server
        run: npm ci || npm install
      
      - name: Create environment file
        working-directory: ./server
        run: |
          cat > ../../.fs-env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DEV_DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          DB_PORT=3306
          PORT=5000
          EOF
      
      - name: Start server in background
        working-directory: ./server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

          # Wait for server readiness (up to ~2 minutes)
          for i in {1..40}; do
            if curl -fsS http://localhost:5000/health > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... attempt $i/40"
            sleep 3
          done

          echo "Server failed readiness check. Startup logs:"
          cat server.log || true
          exit 1
        env:
          NODE_ENV: test
      
      - name: Run test setup
        working-directory: ./server/tests
        run: node setup.js
        continue-on-error: false
      
      - name: Run tests
        working-directory: ./server/tests/api
        run: |
          for test in *.js; do
            if [ -f "$test" ]; then
              echo "Running $test..."
              node "$test"
            fi
          done
        continue-on-error: false
      
      - name: Stop server
        if: always()
        working-directory: ./server
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
      
      - name: Test Results
        if: always()
        run: echo "Tests completed. Check individual test steps for results."
