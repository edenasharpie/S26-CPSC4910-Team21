catalogs:
  parameters:
    - name: userId
      in: path
      description: The user ID of the sponsor
      required: true
      schema:
        type: integer
  get:
    tags:
      - catalog
    summary: List sponsor catalogs
    description: Retrieve a list of catalogs owned by the sponsor's company. Sponsor access required.
    parameters:
      - $ref: '../../schemas/common.yaml#/Parameters/Limit'
      - $ref: '../../schemas/common.yaml#/Parameters/Offset'
    responses:
        '200':
          description: A list of product catalog summaries for the sponsor's company
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../schemas/catalog.yaml#/CatalogSummary'
        '400':
          $ref: '../../schemas/common.yaml#/Responses/400Error'
        '403':
          description: User is not a sponsor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Access forbidden: User is not a sponsor"
        '404':
          $ref: '../../schemas/common.yaml#/Responses/404Error'
        '500':
          $ref: '../../schemas/common.yaml#/Responses/500Error'
  post:
    tags:
      - catalog
    summary: Create a new catalog
    description: Create a new product catalog for the sponsor's company. The sponsorCompanyId is automatically populated from the sponsor's user record. Sponsor access required.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              externalProductIds:
                type: array
                items:
                  type: string
                description: Optional array of external product IDs to add to the catalog
              pointCost:
                type: number
                description: Point cost for items added from external products
    responses:
        '201':
          description: Catalog created successfully
          content:
            application/json:
              schema:
                $ref: '../../schemas/catalog.yaml#/CatalogSummary'
        '400':
          $ref: '../../schemas/common.yaml#/Responses/400Error'
        '403':
          description: User is not a sponsor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          $ref: '../../schemas/common.yaml#/Responses/404Error'
        '500':
          $ref: '../../schemas/common.yaml#/Responses/500Error'

catalogsById:
  parameters:
    - name: userId
      in: path
      description: The user ID of the sponsor
      required: true
      schema:
        type: integer
    - name: catalogId
      in: path
      description: The unique identifier of the product catalog
      required: true
      schema:
        type: integer
  get:
    tags:
      - catalog
    summary: Get sponsor catalog by ID
    description: Retrieve details for a specific catalog owned by the sponsor's company. Sponsor access required.
    responses:
      '200':
        description: Details of the specified catalog with items
        content:
          application/json:
            schema:
              $ref: '../../schemas/catalog.yaml#/Catalog'
      '400':
        $ref: '../../schemas/common.yaml#/Responses/400Error'
      '403':
        description: Catalog does not belong to sponsor's company or user is not a sponsor
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
      '404':
        $ref: '../../schemas/common.yaml#/Responses/404Error'
      '500':
        $ref: '../../schemas/common.yaml#/Responses/500Error'
  patch:
    tags:
      - catalog
    summary: Update catalog
    description: Update an existing product catalog owned by the sponsor's company. Sponsor access required.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            description: Currently no updatable fields at catalog level (items managed separately)
    responses:
      '200':
        description: Catalog updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/catalog.yaml#/CatalogSummary'
      '400':
        $ref: '../../schemas/common.yaml#/Responses/400Error'
      '403':
        description: Catalog does not belong to sponsor's company
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Access forbidden: Catalog does not belong to your company"
      '404':
        $ref: '../../schemas/common.yaml#/Responses/404Error'
      '500':
        $ref: '../../schemas/common.yaml#/Responses/500Error'
  delete:
    tags:
      - catalog
    summary: Delete catalog
    description: Delete a product catalog owned by the sponsor's company. Sponsor access required.
    responses:
      '204':
        description: Catalog deleted successfully
      '400':
        $ref: '../../schemas/common.yaml#/Responses/400Error'
      '403':
        description: Catalog does not belong to sponsor's company
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Access forbidden: Catalog does not belong to your company"
      '404':
        $ref: '../../schemas/common.yaml#/Responses/404Error'
      '500':
        $ref: '../../schemas/common.yaml#/Responses/500Error'

